# config.yaml
# 用于配置 LlamaRec 训练脚本的参数文件

# --- 1. 路径配置 ---
paths:
  train_dataset_path: "../data/KuaiRand-27K-with_feature/output_KuaiRand-27K-0501/5_KuaiRand-27K_pt_data.json"
  test_dataset_path: "../data/KuaiRand-27K-with_feature/output_KuaiRand-27K-0501/5_KuaiRand-27K_pt_data.json"
  output_dir: "./llama-rec_KuaiRand-27K-0501-checkpoints/medium"
  tokenizer_dir: "./rq_code_tokenizer_KuaiRand-27K-0501"

# --- 2. 数据和模型架构配置 ---
model_params:
  # 数据预处理相关
  max_seq_length: 2000

  # LlamaRecConfig 模型架构相关
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 12
  num_attention_heads: 12
  rms_norm_eps: 1.0e-6


# --- 3. 训练过程配置 ---
# 这些参数将直接传递给 transformers.TrainingArguments
training_args:
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 512
  gradient_accumulation_steps: 1
  learning_rate: 6.e-5
  num_train_epochs: 500
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0
  save_strategy: "epoch"
  logging_steps: 100
  save_total_limit: 5
  fp16: true
  report_to: "tensorboard"
  remove_unused_columns: false
  batch_eval_metrics: false