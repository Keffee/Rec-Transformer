paths:
  train_dataset_path: "../data/KuaiRand-27K-with_feature/output_KuaiRand-27K-0501/5_KuaiRand-27K_pt_data.json"
  test_dataset_path: "../data/KuaiRand-27K-with_feature/output_KuaiRand-27K-0501/5_KuaiRand-27K_pt_data.json"
  output_dir: "llama-rec_KuaiRand-27K-0501-checkpoints/small"
  tokenizer_dir: "./rq_code_tokenizer_KuaiRand-27K-0501"

model_params:
  max_seq_length: 2000
  hidden_size: 512
  intermediate_size: 2048
  num_hidden_layers: 8
  num_attention_heads: 8
  rms_norm_eps: 1.0e-6

training_args:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 512
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  num_train_epochs: 300
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0
  save_strategy: "epoch"
  logging_steps: 100
  save_total_limit: 5
  fp16: true
  report_to: "tensorboard"
  remove_unused_columns: false
  batch_eval_metrics: false
