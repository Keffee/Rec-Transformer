# config.yaml
# 用于配置 LlamaRec 训练脚本的参数文件

# --- 1. 路径配置 ---
paths:
  train_dataset_path: "/home/kfwang/20250813Reproduct_Onerec/Fuxi-OneRec/Rec-Transformer/data/KuaiRand-27K-with_feature/5_KuaiRand-27K_pt_data.json"
  test_dataset_path: "/home/kfwang/20250813Reproduct_Onerec/Fuxi-OneRec/Rec-Transformer/data/KuaiRand-27K-with_feature/5_KuaiRand-27K_pt_data.json"
  output_dir: "./llama-rec_KuaiRand-27K-with-feature-checkpoints"
  tokenizer_dir: "./rq_code_tokenizer_KuaiRand-27K-with-feature"

# --- 2. 数据和模型架构配置 ---
model_params:
  max_seq_length: 2000
  hidden_size: 1024
  intermediate_size: 4096
  num_hidden_layers: 24
  num_attention_heads: 16
  rms_norm_eps: 1.0e-6

# --- 3. 训练过程配置 ---
# 这些参数将直接传递给 transformers.TrainingArguments
training_args:
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  num_train_epochs: 20
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0
  logging_steps: 100
  save_strategy: "epoch"
  save_total_limit: 20
  fp16: true
  report_to: "tensorboard"
  remove_unused_columns: false
  batch_eval_metrics: false
  dataloader_num_workers: 8